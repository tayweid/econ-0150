<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>ECON 0150 | Part 1 preview</title>
    <link rel="stylesheet" href="https://tayweid.github.io/course-assets/course.css">
    <link rel="stylesheet" href="assets/styles/prototype.css">
    <script>
        document.documentElement.classList.add('js-enabled');
        window.__courseRendererWatchdog = window.setTimeout(function () {
            var page = document.querySelector('[data-part]');
            if (!page || page.dataset.courseRendererStarted === 'true') return;
            page.removeAttribute('aria-busy');
            var error = page.querySelector('.course-render-error');
            error.hidden = false;
            error.textContent = 'The course preview could not start. ';
            var link = document.createElement('a');
            link.href = page.dataset.courseFallback;
            link.textContent = 'Open the standard Part 1 page.';
            error.appendChild(link);
        }, 5000);
    </script>
    <script defer src="assets/vendor/js-yaml.min.js?v=20260831"></script>
    <script defer src="assets/scripts/yaml-course-page.js?v=20260831"></script>
</head>
<body>
    <a class="skip-link" href="#course-content">Skip to course content</a>
    <div class="wrapper course-econ-0150">
        <aside class="left_div" data-course-left-nav></aside>
        <main id="course-content" class="content" data-part="1" data-course-source="course-content-prototype.yml" data-course-fallback="part-1.html" aria-busy="true">
            <div class="renderer-status renderer-loading" data-course-status role="status" aria-live="polite">Loading course content…</div>
            <div class="renderer-status course-render-error" role="alert" hidden></div>
            <noscript><div class="renderer-status course-render-error">This preview needs JavaScript. <a href="part-1.html">Open the standard Part 1 page.</a></div></noscript>
            <div class="course-output" data-course-output></div>
        </main>
        <aside class="right_div" data-course-right-nav></aside>
    </div>
</body>
</html>
