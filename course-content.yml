  '3':
    title: Univariate GLM
    tagline: Studying the population using a sample
    introduction: 'Data is a sample drawn from an unobservable population. While we can summarize our data, our main questions are typically about the unobservable population our sample was drawn from. Part 3 develops the most basic tools of the General Linear Model (GLM), which allow us to make inferences about unknown populations from known samples. The core idea: the Central Limit Theorem tells us the distribution of the sample mean without needing to know the population distribution. This idea forms the backbone of modern empirical science. It''s difficult to overstate how important this idea has been in our modern world.'
    blocks:
    - id: '3.1'
      nav: Random Variables
      title: Random Variables
      description: Data is a sample drawn from an unobservable population. We can summarize the sample, but our questions are about the population.
      episode:
